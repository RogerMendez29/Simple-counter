<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Counter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <h1 class="title">Counter</h1>
      <div class="display" id="display">0</div>
      <div class="controls">
        <button class="btn btn--decrement" id="decrement">−</button>
        <button class="btn btn--reset" id="reset">Reset</button>
        <button class="btn btn--increment" id="increment">+</button>
      </div>
    </div>

    <script>
      const display = document.getElementById("display");
      let count = 0;

      function render() {
        display.textContent = count;
        display.className = "display" + (count > 0 ? " positive" : count < 0 ? " negative" : "");
      }

      document.getElementById("increment").addEventListener("click", () => { count++; render(); });
      document.getElementById("decrement").addEventListener("click", () => { count--; render(); });
      document.getElementById("reset").addEventListener("click", () => { count = 0; render(); });
    </script>
  </body>
</html>
