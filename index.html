<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soccer Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <div class="header">
        <span class="ball">⚽</span>
        <h1 class="title">Soccer Tracker</h1>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat__label">Goals</span>
          <span class="stat__value" id="goals">0</span>
        </div>
        <div class="divider"></div>
        <div class="stat">
          <span class="stat__label">Misses</span>
          <span class="stat__value" id="misses">0</span>
        </div>
      </div>

      <div class="attempts">
        <span id="attempts">0 attempts</span>
      </div>

      <div class="controls">
        <button class="btn btn--goal" id="goal">⚽ Goal</button>
        <button class="btn btn--miss" id="miss">Miss</button>
        <button class="btn btn--reset" id="reset">Reset</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
